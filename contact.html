<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — GFDI</title>
    <meta name="description"
        content="Reach out to Gender Frontier Development Initiatives (GFDI) for general inquiries.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <header class="site-header header-solid" id="site-header"></header>

    <main>
        <section class="page-hero page-hero-img bg-green text-cream">
            <div class="page-hero-photo"
                style="background-image: url('https://images.unsplash.com/photo-1521791136064-7986c2920216?q=80&w=1200&auto=format&fit=crop');">
            </div>
            <div class="page-hero-fade"></div>
            <div class="container reveal">
                <h1>Contact Us</h1>
                <p>Have a question about our advocacy work? Get in touch with the GFDI team.</p>
            </div>
        </section>

        <section class="form-page section-padding">
            <div class="container">
                <div class="form-wrapper reveal">

                    <div style="display:flex;flex-wrap:wrap;gap:2rem;margin-bottom:3rem;">
                        <a href="mailto:info@gfdinitiative.org"
                            style="font-weight:600;display:flex;align-items:center;gap:.5rem;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                </path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            info@gfdinitiative.org
                        </a>
                        <a href="tel:+2348055555336" style="font-weight:600;display:flex;align-items:center;gap:.5rem;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                                </path>
                            </svg>
                            080 555 55336
                        </a>
                        <p style="width:100%;font-size:.9rem;opacity:.7;"><strong>Note:</strong> If you are reporting a
                            critical issue, please use our secure <a href="/report.html"
                                style="text-decoration:underline;">Report a Case</a> form.</p>
                    </div>

                    <div class="form-success" id="form-success">
                        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--c-green-dark)"
                            stroke-width="1.5">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="9 12 11 14 15 10" />
                        </svg>
                        <h3>Message Received</h3>
                        <p>Thank you. A member of GFDI will reply to you soon.</p>
                    </div>

                    <form id="contact-form" novalidate>
                        <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_KEY">
                        <input type="hidden" name="subject" value="[GFDI] General Contact Inquiry">
                        <input type="hidden" name="from_name" value="GFDI Contact Form">

                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
                            <div class="form-group">
                                <label for="name">Name <span style="color:#a83232;">*</span></label>
                                <input type="text" id="name" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email address <span style="color:#a83232;">*</span></label>
                                <input type="email" id="email" name="email" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="message">Message <span style="color:#a83232;">*</span></label>
                            <textarea id="message" name="message" rows="5" required
                                placeholder="How can we help you?"></textarea>
                        </div>

                        <div class="form-submit">
                            <button type="submit" class="btn btn-dark">Send Message</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
    <script type="module">
        import { renderHeader, renderFooter, initScrollReveal } from '/src/components.js';
        renderHeader('contact');
        renderFooter();
        initScrollReveal();

        const form = document.getElementById('contact-form');
        const success = document.getElementById('form-success');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = new FormData(form);
            const submit = form.querySelector('[type="submit"]');
            submit.textContent = 'Sending…';
            submit.disabled = true;
            try {
                const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: data });
                const json = await res.json();
                if (json.success) {
                    form.style.display = 'none';
                    success.classList.add('show');
                } else {
                    alert('There was a problem sending your message. Please email info@gfdinitiative.org directly.');
                    submit.textContent = 'Send Message';
                    submit.disabled = false;
                }
            } catch {
                alert('Could not connect. Please email info@gfdinitiative.org directly.');
                submit.textContent = 'Send Message';
                submit.disabled = false;
            }
        });
    </script>
</body>

</html>
