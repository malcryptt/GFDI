<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="keywords"
        content="NGO in Nigeria, NGO in Akure, NGO in Ijapo, NGO in Ondo State, child rights advocacy, women empowerment Nigeria, gender-based violence prevention, FGM eradication, end child labour, human trafficking intervention, human rights advocacy, grassroots organization Nigeria, vulnerable children protection">
    <meta property="og:title" content="Gender Frontier Development Initiatives">
    <meta property="og:description"
        content="Empowering women, protecting children, and ending human rights violations like FGM and human trafficking in Nigeria.">
    <meta property="og:type" content="website">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events &amp; Activities &mdash; GFDI</title>
    <meta name="description"
        content="Stay up to date with GFDI latest events, community outreach programmes, advocacy campaigns, and activities across Nigeria.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
    <style>
        .events-filter {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .filter-btn {
            padding: 0.45rem 1.25rem;
            border: 1.5px solid var(--c-green);
            background: transparent;
            color: var(--c-green);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.2s, color 0.2s;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--c-green);
            color: var(--c-cream);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }

        .event-card {
            background: #fff;
            border: 1px solid rgba(20, 70, 35, 0.1);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            transition: transform 0.25s, box-shadow 0.25s;
            display: flex;
            flex-direction: column;
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
        }

        .event-media {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: var(--c-green-dark);
        }

        .event-media-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            background: #000;
        }

        .event-media-placeholder {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, var(--c-green-dark) 0%, var(--c-green) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .event-media-placeholder svg {
            opacity: 0.25;
        }

        .event-body {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .event-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.85rem;
            flex-wrap: wrap;
        }

        .event-tag {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--c-cream);
            background: var(--c-green);
            padding: 0.25rem 0.6rem;
            border-radius: 2px;
        }

        .event-date {
            font-size: 0.8rem;
            color: #888;
            font-weight: 500;
        }

        .event-location {
            font-size: 0.8rem;
            color: #888;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .event-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--c-green-dark);
            margin: 0 0 0.75rem;
            line-height: 1.35;
        }

        .event-desc {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.7;
            flex: 1;
        }

        .event-readmore {
            margin-top: 1.25rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--c-green);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            border-bottom: 1.5px solid transparent;
            transition: border-color 0.2s;
        }

        .event-readmore:hover {
            border-color: var(--c-green);
        }

        .event-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 25, 15, 0.75);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .event-modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .event-modal {
            background: #fff;
            border-radius: 6px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: translateY(20px);
            transition: transform 0.25s;
        }

        .event-modal-overlay.open .event-modal {
            transform: translateY(0);
        }

        .event-modal-header {
            position: relative;
        }

        .event-modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .event-modal-body {
            padding: 2rem;
        }

        .event-modal-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--c-green-dark);
            margin-bottom: 0.5rem;
        }

        .event-modal-desc {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #444;
            margin-top: 1.25rem;
        }

        .no-events {
            text-align: center;
            padding: 5rem 1rem;
            color: #aaa;
            grid-column: 1 / -1;
        }

        .no-events svg {
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        @media (max-width: 600px) {
            .events-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="site-header header-solid" id="site-header"></header>

    <main>
        <section class="page-hero page-hero-img bg-green text-cream">
            <div class="page-hero-photo"
                style="background-image: url('https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?q=80&w=1400&auto=format&fit=crop');">
            </div>
            <div class="page-hero-fade"></div>
            <div class="container reveal">
                <h1>Events &amp; Activities</h1>
                <p>Follow GFDI on the ground &mdash; community outreach, advocacy campaigns, workshops, and more.</p>
            </div>
        </section>

        <section class="section-padding bg-cream text-charcoal" id="events-section">
            <div class="container">
                <div class="events-filter reveal" id="filter-bar">
                    <button class="filter-btn active" data-filter="all">All Events</button>
                    <button class="filter-btn" data-filter="outreach">Outreach</button>
                    <button class="filter-btn" data-filter="advocacy">Advocacy</button>
                    <button class="filter-btn" data-filter="workshop">Workshop</button>
                    <button class="filter-btn" data-filter="awareness">Awareness</button>
                    <a href="/gallery.html"
                        style="margin-left:auto; display:inline-flex; align-items:center; gap:0.4rem; color:var(--c-green-dark); font-weight:700; text-decoration:none; padding: 0.45rem 0;">View
                        Full Gallery &rarr;</a>
                </div>
                <div class="events-grid reveal" id="events-grid"></div>
            </div>
        </section>
    </main>

    <div class="event-modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Event detail">
        <div class="event-modal" id="modal-box">
            <div class="event-modal-header" id="modal-media-area"></div>
            <button class="event-modal-close" id="modal-close" aria-label="Close">&times;</button>
            <div class="event-modal-body">
                <div class="event-meta" id="modal-meta"></div>
                <h2 class="event-modal-title" id="modal-title"></h2>
                <p class="event-modal-desc" id="modal-desc"></p>
            </div>
        </div>
    </div>

    <footer class="site-footer" id="site-footer"></footer>

    <script type="module">
        import { renderHeader, renderFooter, initScrollReveal } from '/src/components.js';
        renderHeader('events');
        renderFooter();
        initScrollReveal();

        const EVENTS = [
            {
                id: "evt-001",
                title: "School Sensitization Outreach \u2014 Ifedore LGA",
                date: "2026",
                location: "Ondo State",
                category: "outreach",
                summary: "GFDI team arrived at secondary schools in Ifedore LGA, Ondo State, to launch a sensitization programme on GBV, FGM, and child labour.",
                desc: "Gender Frontier Development Initiatives launched its school sensitization outreach across secondary schools in Ifedore Local Government Area of Ondo State. The GFDI team, dressed in branded gear and bearing their campaign banners, arrived at participating schools to begin a structured programme educating students on gender-based violence, female genital mutilation, and the eradication of child labour. The outreach aimed to empower young people to recognize abuse, speak up, and become community advocates.",
                media: { type: "image", src: "https://res.cloudinary.com/yvvlok3z/image/upload/f_auto,q_auto,w_800/v1786174899/DSC_5015.JPG_rhfvca.jpg" }
            },
            {
                id: "evt-002",
                title: "Assembly Address on GBV & Child Rights",
                date: "2026",
                location: "Ondo State",
                category: "awareness",
                summary: "GFDI facilitators addressed large school assemblies, educating hundreds of students on recognizing and reporting abuse.",
                desc: "GFDI facilitators took to school assembly grounds across Ifedore LGA, addressing hundreds of students in green-and-white school uniforms. The sessions focused on three pillars: recognizing and reporting gender-based violence, understanding the harmful consequences of female genital mutilation, and the fundamental right of every child to be free from labour and exploitation. Students were encouraged to ask questions, share experiences, and actively participate in building safer communities.",
                media: { type: "image", src: "https://res.cloudinary.com/yvvlok3z/image/upload/f_auto,q_auto,w_800/v1786174741/DSC_5133.JPG_u28q1t.jpg" }
            },
            {
                id: "evt-003",
                title: "Classroom Sessions & Student Engagement",
                date: "2026",
                location: "Ondo State",
                category: "outreach",
                summary: "GFDI facilitators held interactive classroom sessions where students actively participated, asked questions, and shared experiences.",
                desc: "Following the assembly addresses, GFDI facilitators moved into individual classrooms across multiple schools in Ondo State for more intimate, interactive sessions. Students in blue-and-white uniforms engaged directly with the facilitators, standing up to ask questions and share personal experiences. The sessions covered child labour, trafficking, and the rights of young people to education and safety. Community leaders and teachers also participated, reinforcing the message at the grassroots level.",
                media: { type: "image", src: "https://res.cloudinary.com/yvvlok3z/image/upload/f_auto,q_auto,w_800/v1786174688/DSC_5195.JPG_gmcj1f.jpg" }
            },
            {
                id: "evt-004",
                title: "Media Coverage & Press Recognition",
                date: "2026",
                location: "Ondo State",
                category: "advocacy",
                summary: "The outreach received national media coverage, including a feature by The Nation newspaper, amplifying GFDI's anti-FGM and anti-GBV advocacy.",
                desc: "GFDI's sensitization outreach in Ondo State received national recognition, with The Nation newspaper publishing a feature report on the organization's ongoing campaign for the eradication of female genital mutilation and gender-based violence. The press coverage, alongside a widely circulated 'Say No to Rape' digital awareness campaign, helped extend GFDI's advocacy message beyond the school gates and into the broader public conversation on child protection and gender rights in Nigeria.",
                media: { type: "image", src: "https://res.cloudinary.com/yvvlok3z/image/upload/f_auto,q_auto,w_800/v1786174503/WhatsApp_Image_thenation_l8qyvm.jpg" }
            }
        ];

        const grid = document.getElementById("events-grid");
        const filterBar = document.getElementById("filter-bar");

        function fmtCat(c) { return c.charAt(0).toUpperCase() + c.slice(1); }

        function mediaHTML(m, cls) {
            cls = cls || "event-media";
            if (!m) return '<div class="event-media-placeholder"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>';
            if (m.type === "image") return '<img src="' + m.src + '" alt="" class="' + cls + '" loading="lazy">';
            if (m.type === "video") return '<video class="event-media-video" controls preload="metadata"><source src="' + m.src + '"></video>';
            if (m.type === "youtube") return '<iframe class="event-media-video" src="' + m.src + '" frameborder="0" allowfullscreen></iframe>';
            return "";
        }

        function renderCards(filter) {
            var filtered = filter === "all" ? EVENTS : EVENTS.filter(function (e) { return e.category === filter; });
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-events"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><p style="font-weight:600;font-size:1.1rem;color:#999;">No events in this category yet.</p><p style="font-size:.85rem;margin-top:.5rem;">Check back soon or <a href="/contact.html" style="color:var(--c-green);">contact us</a> for updates.</p></div>';
                return;
            }
            var html = "";
            for (var i = 0; i < filtered.length; i++) {
                var evt = filtered[i];
                html += '<article class="event-card" data-id="' + evt.id + '" role="button" tabindex="0" aria-label="Read more about ' + evt.title + '">';
                html += mediaHTML(evt.media);
                html += '<div class="event-body">';
                html += '<div class="event-meta"><span class="event-tag">' + fmtCat(evt.category) + '</span><span class="event-date">\uD83D\uDCC5 ' + evt.date + '</span></div>';
                html += '<span class="event-location">\uD83D\uDCCD ' + evt.location + '</span>';
                html += '<h2 class="event-title" style="margin-top:.6rem;">' + evt.title + '</h2>';
                html += '<p class="event-desc">' + evt.summary + '</p>';
                html += '<span class="event-readmore">Read more \u2192</span>';
                html += '</div></article>';
            }
            grid.innerHTML = html;

            var cards = grid.querySelectorAll(".event-card");
            for (var j = 0; j < cards.length; j++) {
                (function (card) {
                    var handler = function () { openModal(card.getAttribute("data-id")); };
                    card.addEventListener("click", handler);
                    card.addEventListener("keydown", function (e) { if (e.key === "Enter") handler(); });
                })(cards[j]);
            }
        }

        var filterBtns = filterBar.querySelectorAll(".filter-btn");
        for (var k = 0; k < filterBtns.length; k++) {
            (function (btn) {
                btn.addEventListener("click", function () {
                    for (var b = 0; b < filterBtns.length; b++) filterBtns[b].classList.remove("active");
                    btn.classList.add("active");
                    renderCards(btn.getAttribute("data-filter"));
                });
            })(filterBtns[k]);
        }

        renderCards("all");

        var overlay = document.getElementById("modal-overlay");
        var modalMediaArea = document.getElementById("modal-media-area");
        var modalMeta = document.getElementById("modal-meta");
        var modalTitle = document.getElementById("modal-title");
        var modalDesc = document.getElementById("modal-desc");
        var modalClose = document.getElementById("modal-close");

        function openModal(id) {
            var evt = null;
            for (var i = 0; i < EVENTS.length; i++) { if (EVENTS[i].id === id) { evt = EVENTS[i]; break; } }
            if (!evt) return;
            modalMediaArea.innerHTML = mediaHTML(evt.media, "event-media");
            modalMeta.innerHTML = '<span class="event-tag">' + fmtCat(evt.category) + '</span><span class="event-date">\uD83D\uDCC5 ' + evt.date + '</span><span class="event-location">\uD83D\uDCCD ' + evt.location + '</span>';
            modalTitle.textContent = evt.title;
            modalDesc.textContent = evt.desc;
            overlay.classList.add("open");
            document.body.style.overflow = "hidden";
            modalClose.focus();
        }

        function closeModal() {
            overlay.classList.remove("open");
            document.body.style.overflow = "";
        }

        modalClose.addEventListener("click", closeModal);
        overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
    </script>
</body>

</html>
